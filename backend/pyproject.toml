[project]
name = "neuroinsight-ai-api"
version = "0.1.0"
description = "Academic-use FastAPI service for scoped brain MRI analysis."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.12,<1.0",
  "pydantic>=2.9,<3.0",
  "pillow>=10.0,<12.0",
  "numpy>=1.26,<3.0",
  "onnxruntime>=1.20,<2.0",
  "nibabel>=5.2,<6.0",
  "reportlab>=4.2,<5.0",
  "pypdf>=5.0,<6.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["neuroinsight_api"]

[project.optional-dependencies]
ml = [
  "torch>=2.4,<3.0",
  "torchvision>=0.19,<1.0",
  "opencv-python-headless>=4.10,<5.0",
  "pydicom>=2.4,<4.0"
]
test = [
  "pytest>=8.3,<9.0",
  "httpx>=0.27,<1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
