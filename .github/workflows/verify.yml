name: Verify NeuroInsight AI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: python -m pip install fastapi 'uvicorn[standard]' python-multipart pydantic pillow numpy nibabel reportlab pypdf pytest httpx torch torchvision scikit-learn
      - run: cd backend && PYTHONPATH=. pytest -q tests
      - run: pytest -q ml/tests
