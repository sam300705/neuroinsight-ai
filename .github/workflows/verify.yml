name: Verify NeuroInsight AI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neuroinsight-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/uv.lock
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm check:bundle
      - run: pnpm audit --prod --audit-level=high
      - name: Install browser for deterministic local UI checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify corrupt upload and accessibility in a local production build
        run: |
          set -eu
          JWT_SECRET="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")" NODE_ENV=production PORT=4173 node dist/index.js > /tmp/neuroinsight-browser.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          E2E_BASE_URL=http://127.0.0.1:4173 pnpm test:e2e:corrupt-upload
          E2E_BASE_URL=http://127.0.0.1:4173 pnpm test:e2e:accessibility
          E2E_BASE_URL=http://127.0.0.1:4173 pnpm test:e2e:accessibility-routes
      - name: Block generated caches, local secrets, and raw research artifacts
        run: |
          ! git ls-files | grep -E '(^|/)(__pycache__|\.pytest_cache|\.venv|venv|neuroinsight-datasets|neuroinsight-experiments|datasets|experiments|checkpoints|outputs)(/|$)|(^|/)\.env($|\.)|\.(pyc|pyo|pth|pt|ckpt|onnx|nii|nii\.gz|dcm|nrrd|mha|mhd)$'
      - name: Verify locked Python dependency graph
        run: uv lock --directory backend --check
      - name: Install locked Python test environment
        run: uv sync --directory backend --locked --extra test
      - name: Run Python tests with critical coverage thresholds
        run: |
          cd backend
          uv run --locked --extra test coverage run -m pytest -q tests
          uv run --locked --extra test coverage json -o coverage.json
          uv run --locked --extra test python scripts/check_critical_coverage.py
      - name: Run ML/data tests from the locked environment
        run: uv run --directory backend --locked --extra test pytest -q ../ml/tests
      - name: Audit locked Python dependencies
        run: uv run --directory backend --locked --extra test pip-audit -r requirements.lock --strict
      - name: Generate backend SBOM
        run: uv run --directory backend --locked --extra test cyclonedx-py requirements requirements.lock --output-file /tmp/neuroinsight-backend-sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neuroinsight-backend-sbom
          path: /tmp/neuroinsight-backend-sbom.json
          if-no-files-found: error
      - name: Build and smoke-test credential-free backend container
        run: |
          set -eu
          docker build -t neuroinsight-api-ci ./backend
          docker run --rm -d --name neuroinsight-api-ci -p 127.0.0.1:8000:8000 -e USE_ONNX_CLASSIFIER=false -e ENABLE_EXPERIMENTAL_MODEL=false neuroinsight-api-ci
          cleanup() { docker rm -f neuroinsight-api-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
