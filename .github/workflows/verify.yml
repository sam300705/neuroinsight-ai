name: Verify NeuroInsight AI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neuroinsight-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:bundle
      - run: pnpm audit --prod --audit-level=high
      - name: Block generated caches, local secrets, and raw research artifacts
        run: |
          ! git ls-files | grep -E '(^|/)(__pycache__|\.pytest_cache|\.venv|venv|neuroinsight-datasets|neuroinsight-experiments|datasets|experiments|checkpoints|outputs)(/|$)|(^|/)\.env($|\.)|\.(pyc|pyo|pth|pt|ckpt|onnx|nii|nii\.gz|dcm|nrrd|mha|mhd)$'
      - run: python -m pip install --upgrade pip
      - name: Install Python test dependencies
        run: python -m pip install -r backend/requirements.txt pytest
      - run: cd backend && PYTHONPATH=. pytest -q tests
      - run: pytest -q ml/tests
