name: Verify NeuroInsight AI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: neuroinsight-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Block raw medical-data artifacts
        run: |
          ! git ls-files | grep -E '(^|/)(neuroinsight-datasets|neuroinsight-experiments|.*\.(nii|nii\.gz|dcm)$)'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt pytest torch torchvision scikit-learn
      - run: cd backend && PYTHONPATH=. pytest -q tests
      - run: pytest -q ml/tests
