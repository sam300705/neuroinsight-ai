name: Verify NeuroInsight AI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neuroinsight-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:bundle
      - run: pnpm audit --prod --audit-level=high
      - name: Install browser for deterministic local UI checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify corrupt upload and accessibility in a local production build
        run: |
          set -eu
          NODE_ENV=production PORT=4173 node dist/index.js > /tmp/neuroinsight-browser.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          E2E_BASE_URL=http://127.0.0.1:4173 pnpm test:e2e:corrupt-upload
          E2E_BASE_URL=http://127.0.0.1:4173 pnpm test:e2e:accessibility
          E2E_BASE_URL=http://127.0.0.1:4173 pnpm test:e2e:accessibility-routes
      - name: Block generated caches, local secrets, and raw research artifacts
        run: |
          ! git ls-files | grep -E '(^|/)(__pycache__|\.pytest_cache|\.venv|venv|neuroinsight-datasets|neuroinsight-experiments|datasets|experiments|checkpoints|outputs)(/|$)|(^|/)\.env($|\.)|\.(pyc|pyo|pth|pt|ckpt|onnx|nii|nii\.gz|dcm|nrrd|mha|mhd)$'
      - run: python -m pip install --upgrade pip
      - name: Install Python test dependencies
        run: python -m pip install -r backend/requirements.txt "pytest>=8.3,<9.0" "httpx>=0.27,<1.0"
      - run: cd backend && PYTHONPATH=. pytest -q tests
      - run: pytest -q ml/tests
